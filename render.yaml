services:
  - type: web
    name: family-invest-assistant
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 8787
      - key: DATA_DIR
        value: /var/data
      - key: APP_SECRET
        generateValue: true
      - key: MARKET_PROVIDER
        value: itick
      - key: STRICT_REALTIME
        value: true
      - key: ITICK_BASE_URL
        value: https://api-free.itick.org
      - key: ITICK_FUND_REGION
        value: CN
      - key: ITICK_TOKEN
        sync: false
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
